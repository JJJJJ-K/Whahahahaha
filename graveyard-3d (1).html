<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Graveyard 3D</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#05070b}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}</style></head>
<body><canvas id="c"></canvas>
<script>
/* ---- settings you can change ---- */
const SWAY=2.2;     // how far the camera slides left/right (metres)
const SPEED=.14;    // how fast it slides (smaller = slower)
const BRIGHT=1;     // overall brightness
const FOG=.018;     // distance haze (0 = none)
const SEED=7;       // change for a different arrangement of graves and trees
(()=>{
const cv=document.getElementById('c'),gl=cv.getContext('webgl',{antialias:true});
if(!gl){document.body.style.color='#fff';document.body.textContent='WebGL is not supported on this device';return}
let sd=SEED;const rnd=()=>(sd=(sd*16807)%2147483647)/2147483647,rr=(a,b)=>a+rnd()*(b-a);
const nrm=v=>{const l=Math.hypot(...v)||1;return v.map(x=>x/l)},cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],mul=(a,k)=>a.map(x=>x*k);
const persp=(f,a,n,fa)=>{const t=1/Math.tan(f/2);return[t/a,0,0,0,0,t,0,0,0,0,(fa+n)/(n-fa),-1,0,0,2*fa*n/(n-fa),0]};
const look=(e,c)=>{const z=nrm(sub(e,c)),x=nrm(cross([0,1,0],z)),y=cross(z,x),d=(p)=>-(p[0]*e[0]+p[1]*e[1]+p[2]*e[2]);return[x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,d(x),d(y),d(z),1]};
const mm=(a,b)=>{const o=new Array(16);for(let i=0;i<4;i++)for(let j=0;j<4;j++){let s=0;for(let k=0;k<4;k++)s+=a[k*4+j]*b[i*4+k];o[i*4+j]=s}return o};

/* ---------- procedural textures ---------- */
function tex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');draw(x,w,h);const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,c);gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);const e=gl.getExtension('EXT_texture_filter_anisotropic');e&&gl.texParameterf(gl.TEXTURE_2D,e.TEXTURE_MAX_ANISOTROPY_EXT,4);return t}
const grain=(x,w,h,n,a)=>{for(let i=0;i<n;i++){x.fillStyle=rnd()<.5?`rgba(0,0,0,${a})`:`rgba(255,255,255,${a*.6})`;x.fillRect(rnd()*w,rnd()*h,1+rnd()*2,1+rnd()*2)}};
const moss=(x,w,h,n)=>{for(let i=0;i<n;i++){x.fillStyle=`rgba(${40+rnd()*25|0},${70+rnd()*35|0},${34},${.25+rnd()*.35})`;x.beginPath();x.arc(rnd()*w,h-rnd()*h*.35,2+rnd()*9,0,7);x.fill()}};
const blot=(x,w,h,n,rad,a)=>{for(let i=0;i<n;i++){const px=rnd()*w,py=rnd()*h,r=rad*(.4+rnd()),g=x.createRadialGradient(px,py,0,px,py,r),k=rnd()<.5?'0,0,0':'255,255,255';g.addColorStop(0,`rgba(${k},${a})`);g.addColorStop(1,`rgba(${k},0)`);x.fillStyle=g;x.fillRect(px-r,py-r,r*2,r*2)}};
const T_BRICK=tex(512,512,(x,w,h)=>{x.fillStyle='#14110e';x.fillRect(0,0,w,h);for(let r=0;r<16;r++)for(let c=-1;c<5;c++){const bx=c*128+(r%2)*64+3,by=r*32+3,l=34+rnd()*24;
  x.fillStyle=`hsl(${10+rnd()*18},${10+rnd()*12}%,${l*.55}%)`;x.beginPath();x.moveTo(bx+rnd()*5,by);x.lineTo(bx+123,by+rnd()*3);x.lineTo(bx+123-rnd()*5,by+26);x.lineTo(bx,by+26-rnd()*3);x.fill();
  const g=x.createLinearGradient(0,by,0,by+26);g.addColorStop(0,'rgba(255,255,255,.08)');g.addColorStop(1,'rgba(0,0,0,.28)');x.fillStyle=g;x.fillRect(bx,by,123,26);x.fillStyle='rgba(255,235,220,.16)';x.fillRect(bx,by,123,1.5);x.fillRect(bx,by,1.5,26);x.fillStyle='rgba(0,0,0,.35)';x.fillRect(bx,by+24.5,123,1.5);x.fillRect(bx+121.5,by,1.5,26);for(let q=0;q<40;q++){x.fillStyle=rnd()<.5?'rgba(0,0,0,.28)':'rgba(255,230,210,.12)';x.fillRect(bx+rnd()*120,by+rnd()*24,1+rnd()*2.5,1+rnd()*2)}}
  blot(x,w,h,60,60,.12);grain(x,w,h,22000,.22);for(let i=0;i<26;i++){x.fillStyle='rgba(0,0,0,.2)';x.fillRect(rnd()*w,0,2+rnd()*7,h*(.25+rnd()*.75))}moss(x,w,h,140);for(let i=0;i<10;i++){x.fillStyle='rgba(88,6,10,.65)';const bx=rnd()*w,by=rnd()*h*.45;x.fillRect(bx,by,2+rnd()*3,h*(.12+rnd()*.5));x.beginPath();x.arc(bx+1,by,4+rnd()*4,0,7);x.fill()}
  for(let i=0;i<12;i++){x.fillStyle=`rgba(210,205,190,${.06+rnd()*.1})`;x.fillRect(rnd()*w,rnd()*h*.3,1+rnd()*3,h*(.2+rnd()*.5))}
  for(let i=0;i<14;i++){const bx=rnd()*w,by=rnd()*h;x.fillStyle='rgba(8,6,5,.9)';x.beginPath();x.moveTo(bx,by);x.lineTo(bx+rr(8,22),by+rr(-4,4));x.lineTo(bx+rr(6,18),by+rr(8,18));x.lineTo(bx+rr(-4,6),by+rr(8,16));x.fill()}
  for(let i=0;i<6;i++){let vx=rnd()*w,vy=h;x.strokeStyle='rgba(30,52,24,.85)';x.lineWidth=1.5;x.beginPath();x.moveTo(vx,vy);for(let k=0;k<22;k++){vx+=rr(-9,9);vy-=rr(8,22);x.lineTo(vx,vy)}x.stroke();vx=rnd()*w;vy=h;for(let k=0;k<14;k++){vx+=rr(-9,9);vy-=rr(8,22);x.fillStyle='rgba(40,75,30,.8)';x.beginPath();x.ellipse(vx,vy,4,2.2,rnd()*3,0,7);x.fill()}}});
const T_STONE=tex(512,512,(x,w,h)=>{x.fillStyle='hsl(205,4%,36%)';x.fillRect(0,0,w,h);blot(x,w,h,140,70,.2);grain(x,w,h,30000,.28);
  for(let i=0;i<24;i++){x.fillStyle='rgba(0,0,0,.16)';x.fillRect(rnd()*w,0,3+rnd()*10,h*(.3+rnd()*.7))}
  x.strokeStyle='rgba(0,0,0,.55)';for(let i=0;i<9;i++){let cx=rnd()*w,cy=rnd()*h;x.lineWidth=1+rnd()*1.5;x.beginPath();x.moveTo(cx,cy);for(let k=0;k<10;k++){cx+=rr(-16,16);cy+=rr(5,22);x.lineTo(cx,cy)}x.stroke()}
  for(let i=0;i<70;i++){x.fillStyle=`rgba(${rnd()<.3?'20,24,16':'110,130,55'},${.2+rnd()*.3})`;x.beginPath();x.arc(rnd()*w,rnd()*h,1+rnd()*7,0,7);x.fill()}for(let i=0;i<260;i++){const px=rnd()*w,py=rnd()*h,r=1+rnd()*3;x.fillStyle='rgba(0,0,0,.35)';x.beginPath();x.arc(px,py,r,0,7);x.fill();x.fillStyle='rgba(255,255,255,.14)';x.beginPath();x.arc(px-.8,py-.8,r*.6,0,7);x.fill()}
  for(let i=0;i<40;i++){const px=rnd()*w,py=rnd()*h;for(let k=0;k<9;k++){x.fillStyle=`rgba(${150+rnd()*40|0},${160+rnd()*40|0},${110+rnd()*30|0},${.18+rnd()*.25})`;x.beginPath();x.arc(px+rr(-9,9),py+rr(-9,9),1+rnd()*3.5,0,7);x.fill()}}
  for(let i=0;i<14;i++){x.fillStyle=`rgba(0,0,0,${.05+rnd()*.07})`;x.fillRect(0,rnd()*h,w,1+rnd()*3)}moss(x,w,h,110)});
const T_BARK=tex(256,256,(x,w,h)=>{x.fillStyle='#2a2119';x.fillRect(0,0,w,h);for(let i=0;i<110;i++){x.fillStyle=`rgba(${rnd()<.5?'0,0,0':'90,75,60'},${.18+rnd()*.3})`;x.fillRect(rnd()*w,0,1+rnd()*5,h*(.3+rnd()*.7))}
  for(let i=0;i<8;i++){const px=rnd()*w,py=rnd()*h,g=x.createRadialGradient(px,py,0,px,py,14);g.addColorStop(0,'rgba(0,0,0,.8)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.beginPath();x.ellipse(px,py,10,18,0,0,7);x.fill()}grain(x,w,h,9000,.25);moss(x,w,h,30)});
const T_IRON=tex(128,128,(x,w,h)=>{x.fillStyle='#2b2623';x.fillRect(0,0,w,h);for(let i=0;i<70;i++){x.fillStyle=`rgba(${130+rnd()*50|0},${55+rnd()*30|0},20,${.15+rnd()*.35})`;x.beginPath();x.arc(rnd()*w,rnd()*h,1+rnd()*8,0,7);x.fill()}grain(x,w,h,2500,.3);for(let i=0;i<6;i++){x.fillStyle='rgba(255,255,255,.12)';x.fillRect(rnd()*w,0,1,h)}for(let i=0;i<40;i++){const px=rnd()*w,py=rnd()*h,g=x.createRadialGradient(px,py,0,px,py,6);g.addColorStop(0,'rgba(0,0,0,.4)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(px-6,py-6,12,12)}
  for(let i=0;i<22;i++){x.fillStyle=`rgba(${150+rnd()*60|0},${60+rnd()*30|0},18,${.2+rnd()*.3})`;x.fillRect(rnd()*w,rnd()*h*.5,1+rnd()*2,h*(.2+rnd()*.5))}});
const T_GROUND=tex(512,512,(x,w,h)=>{x.fillStyle='#3b342b';x.fillRect(0,0,w,h);blot(x,w,h,90,70,.18);grain(x,w,h,16000,.24);
  for(let i=0;i<2600;i++){const gx=rnd()*w,gy=rnd()*h,l=3+rnd()*9,g=rnd();x.strokeStyle=`rgba(${50+g*60|0},${60+g*55|0},${25+g*20|0},${.25+rnd()*.35})`;x.lineWidth=1;x.beginPath();x.moveTo(gx,gy);x.quadraticCurveTo(gx+rr(-3,3),gy-l*.5,gx+rr(-6,6),gy-l);x.stroke()}
  for(let i=0;i<420;i++){const g=48+rnd()*52|0;x.fillStyle=`rgb(${g},${g-4},${g-9})`;x.beginPath();x.ellipse(rnd()*w,rnd()*h,1+rnd()*4,1+rnd()*3,rnd()*3,0,7);x.fill()}
  for(let i=0;i<150;i++){x.fillStyle=`hsl(${18+rnd()*18},${40+rnd()*25}%,${14+rnd()*14}%)`;x.save();x.translate(rnd()*w,rnd()*h);x.rotate(rnd()*6);x.beginPath();x.ellipse(0,0,3+rnd()*5,1.5+rnd()*2.5,0,0,7);x.fill();x.restore()}
  for(let i=0;i<7;i++){const px=rnd()*w,py=rnd()*h,r=18+rnd()*40,g=x.createRadialGradient(px,py,0,px,py,r);g.addColorStop(0,'rgba(8,12,20,.95)');g.addColorStop(.75,'rgba(10,14,22,.8)');g.addColorStop(1,'rgba(10,14,22,0)');x.fillStyle=g;x.beginPath();x.ellipse(px,py,r*1.5,r*.8,0,0,7);x.fill()}
  for(let i=0;i<5;i++){const px=rnd()*w,py=rnd()*h,r=14+rnd()*30,g=x.createRadialGradient(px,py,0,px,py,r);g.addColorStop(0,'rgba(78,4,8,.9)');g.addColorStop(1,'rgba(78,4,8,0)');x.fillStyle=g;x.beginPath();x.ellipse(px,py,r*1.3,r*.8,rnd()*3,0,7);x.fill()}
  x.strokeStyle='rgba(75,62,40,.6)';x.lineWidth=1;for(let i=0;i<500;i++){const px=rnd()*w,py=rnd()*h;x.beginPath();x.moveTo(px,py);x.lineTo(px+rr(-6,6),py+rr(-12,-3));x.stroke()}
  x.strokeStyle='rgba(0,0,0,.5)';for(let i=0;i<10;i++){let cx=rnd()*w,cy=rnd()*h;x.beginPath();x.moveTo(cx,cy);for(let k=0;k<8;k++){cx+=rr(-14,14);cy+=rr(-14,14);x.lineTo(cx,cy)}x.stroke()}
  for(let i=0;i<14;i++){x.fillStyle='rgba(200,190,165,.75)';x.save();x.translate(rnd()*w,rnd()*h);x.rotate(rnd()*6);x.fillRect(0,0,6+rnd()*8,2);x.restore()}});
const T_WHITE=tex(2,2,x=>{x.fillStyle='#fff';x.fillRect(0,0,2,2)});

/* ---------- tiny geometry kit (everything is batched per texture) ---------- */
const TT={x:0,y:0,z:0,r:0},mkB=(t,w)=>({p:[],n:[],u:[],c:[],tex:t,wet:w}),B={brick:mkB(T_BRICK,.15),stone:mkB(T_STONE,.3),ground:mkB(T_GROUND,.95),plain:mkB(T_WHITE,.45),grass:mkB(T_WHITE,.1),wood:mkB(T_BARK,.12),iron:mkB(T_IRON,.5)};
let ND=0;const at=(x,y,z,r,f)=>{const o={...TT},co=Math.cos(o.r),si=Math.sin(o.r),hy=ND?0:H0(x,z);ND++;Object.assign(TT,{x:o.x+co*x+si*z,y:o.y+y+hy,z:o.z-si*x+co*z,r:o.r+r});f();ND--;Object.assign(TT,o)};
function V(b,p,n,u,v,c){const co=Math.cos(TT.r),si=Math.sin(TT.r);b.p.push(co*p[0]+si*p[2]+TT.x,p[1]+TT.y,-si*p[0]+co*p[2]+TT.z);b.n.push(co*n[0]+si*n[2],n[1],-si*n[0]+co*n[2]);b.u.push(u,v);b.c.push(...c)}
function quad(b,a,b2,c,d,n,ts,col){const du=Math.hypot(...sub(b2,a))/ts,dv=Math.hypot(...sub(d,a))/ts;[[a,0,0],[b2,du,0],[c,du,dv],[a,0,0],[c,du,dv],[d,0,dv]].forEach(q=>V(b,q[0],n,q[1],q[2],col))}
function box(b,w,h,d,col,ts=1){const x=w/2,z=d/2;
  quad(b,[-x,0,z],[x,0,z],[x,h,z],[-x,h,z],[0,0,1],ts,col);quad(b,[x,0,-z],[-x,0,-z],[-x,h,-z],[x,h,-z],[0,0,-1],ts,col);
  quad(b,[x,0,z],[x,0,-z],[x,h,-z],[x,h,z],[1,0,0],ts,col);quad(b,[-x,0,-z],[-x,0,z],[-x,h,z],[-x,h,-z],[-1,0,0],ts,col);
  quad(b,[-x,h,z],[x,h,z],[x,h,-z],[-x,h,-z],[0,1,0],ts,col)}
function tube(b,a,c,r0,r1,seg,col,ts=1){const dir=nrm(sub(c,a)),up=Math.abs(dir[1])>.95?[1,0,0]:[0,1,0],u=nrm(cross(dir,up)),w=cross(dir,u),len=Math.hypot(...sub(c,a));
  const ring=(p,r,i)=>{const t=i/seg*6.2832,cs=Math.cos(t),sn=Math.sin(t);return[add(p,add(mul(u,cs*r),mul(w,sn*r))),add(mul(u,cs),mul(w,sn))]};
  for(let i=0;i<seg;i++){const A=ring(a,r0,i),Bq=ring(a,r0,i+1),C=ring(c,r1,i+1),D=ring(c,r1,i),u0=i/seg*ts*2,u1=(i+1)/seg*ts*2,vv=len/ts;
    [[A,u0,0],[Bq,u1,0],[C,u1,vv],[A,u0,0],[C,u1,vv],[D,u0,vv]].forEach(q=>V(b,q[0][0],q[0][1],q[1],q[2],col))}}
const IRON=[1.15,1.05,1,0],DARK=[.07,.06,.06,0],WARM=[1,.62,.28,.85];
const GH=mkB(T_WHITE,0);
function lathe(b,pr,seg,col,fl){for(let j=0;j<pr.length-1;j++)for(let i=0;i<seg;i++){const q=(jj,ii)=>{const a=ii/seg*6.2832,r=pr[jj][1],k=1+(fl?fl*Math.sin(a*7+jj*.6)*Math.max(0,1-jj/(pr.length*.45)):0);return[[Math.cos(a)*r*k,pr[jj][0],Math.sin(a)*r*k],[Math.cos(a),.3,Math.sin(a)]]};
  [[j,i],[j,i+1],[j+1,i+1],[j,i],[j+1,i+1],[j+1,i]].forEach(([jj,ii])=>{const o=q(jj,ii);V(b,o[0],o[1],ii/seg,pr[jj][0],col)})}}

/* ---------- build the scene ---------- */
const sstep=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t)};
const roadX=z=>sstep(-2,-14,z)*(Math.sin(z*.11)*2.4+Math.sin(z*.29+1)*.7),roadW=z=>5.6+1.2*Math.sin(z*.4)-Math.min(1,Math.max(0,-z/60))*1.5;
const H0=(x,z)=>(.3*Math.sin(x*.35+z*.21)*Math.sin(z*.18-x*.12)+.12*Math.sin(x*.9+z*.7))*sstep(1,-6,z)*(1-sstep(-60,-90,z))*(.4+.6*Math.min(1,Math.abs(x-roadX(z))/6));
{const NX=40,NZ=52,x0=-40,z0=12,dx=2,dz=-2;   // rolling terrain with greener patches away from the road
  const tv=(a,b)=>{const x=x0+a*dx,z=z0+b*dz,e=.6,nn=nrm([-(H0(x+e,z)-H0(x-e,z))/(2*e),1,-(H0(x,z+e)-H0(x,z-e))/(2*e)]),gp=Math.max(0,Math.sin(x*.21+Math.sin(z*.17)*2)*Math.sin(z*.23+x*.05))*Math.min(1,Math.abs(x-roadX(z))/5);
    V(B.ground,[x,H0(x,z),z],nn,x/5,z/5,[1.3-.7*gp,1.2-.15*gp,1.1-.55*gp,0])};
  for(let i=0;i<NX;i++)for(let j=0;j<NZ;j++){tv(i,j);tv(i+1,j);tv(i+1,j+1);tv(i,j);tv(i+1,j+1);tv(i,j+1)}}
{const rows=9,st=1.4;   // winding dirt road with ragged edges, wheel ruts and bumps
  const P=(z,j)=>{const w=roadW(z),u=j/rows-.5,edge=j===0||j===rows,jit=edge?Math.sin(z*3.7+j)*.35+Math.sin(z*1.3)*.25:0,x=roadX(z)+u*w+Math.sign(u)*jit,
    rut=-.08*Math.exp(-Math.pow((u*2-.5)/.2,2))-.08*Math.exp(-Math.pow((u*2+.5)/.2,2));return[x,H0(x,z)+.03+rut+.025*Math.sin(z*2.1+u*5)*Math.cos(x*1.7)-(edge?.03:0),z]};
  for(let k=0;k<58;k++){const z1=3-k*st,z2=z1-st;for(let j=0;j<rows;j++){const a=P(z1,j),b=P(z1,j+1),c=P(z2,j+1),d=P(z2,j),n=nrm(cross(sub(b,a),sub(d,a)));
    [[a],[b],[c],[a],[c],[d]].forEach(([q])=>V(B.ground,q,n,q[0]/3.5,q[2]/3.5,[1.9,1.75,1.55,0]))}}}
for(let k=0;k<46;k++)for(const sd of[-1,1]){const z=3-k*1.3,x=roadX(z)+sd*(roadW(z)/2+rr(-.1,.35));at(x,0,z,rr(0,6),()=>box(B.stone,rr(.3,.6),rr(.12,.32),rr(.25,.45),[.9,.9,.95,0],.6))}   // edge stones
for(let i=0;i<170;i++){const z=-rr(-3,60),x=roadX(z)+rr(-.45,.45)*roadW(z);at(x,.02,z,rr(0,6),()=>box(B.stone,rr(.06,.18),rr(.04,.1),rr(.06,.16),[1,1,1.05,0],.4))}   // loose gravel and rocks
for(let i=0;i<6;i++){const z=-rr(2,40);at(roadX(z)+rr(-.6,.6),.1,z,rr(0,3),()=>tube(B.wood,[-1.5,0,0],[1.5,rr(0,.2),rr(-.3,.3)],.07,.04,6,[1.2,1.1,1,0],1))}   // fallen branches
for(let i=0;i<14;i++){const z=-rr(0,30);at(roadX(z)+rr(-.4,.4)*roadW(z),.03,z,rr(0,6),()=>box(B.plain,rr(.1,.2),.025,.03,[.8,.76,.64,0],.3))}   // bones in the dirt
box(B.stone,16,.2,2.6,[.8,.8,.82,0],1.2);at(0,0,0,0,()=>{});                                         // front step
